name: "💡 Idea or suggestion"
description: A new chapter, a ship model, a colour, a setting, anything that would make the story better
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it add, or what bothers you now?
  - type: textarea
    id: sketch
    attributes:
      label: Sketch
      description: Optional. ASCII art, a mock-up or an image.
      render: text
